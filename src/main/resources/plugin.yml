name: BurpPlugin
version: '1.1'
main: hex.wald.BurpPlugin
api-version: '1.21'

commands:
  burp:
    description: Burp
    usage: /burp [quiet|deep|mute|bind|reload]

permissions:
  burp.use:
    description: Use the burp command and binds
    default: true
  burp.reload:
    description: Reload BurpPlugin settings
    default: op
